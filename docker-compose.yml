services:

  # MySQL 8.4
  tmg_db:
    image: mysql:8.4
    container_name: tmg_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE:      ${DB_DATABASE:-typing_game}
      MYSQL_USER:          ${DB_USERNAME:-tmg}
      MYSQL_PASSWORD:      ${DB_PASSWORD}
    volumes:
      - tmg_db_data:/var/lib/mysql
    networks:
      - tmg_net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1",
             "-u", "root", "--password=${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Laravel web (Nginx + PHP-FPM)
  tmg_app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmg_app
    command: ["/usr/bin/supervisord", "-n", "-c", "/etc/supervisord.conf"]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8084:80"
    env_file:
      - .env
    environment:
      DB_HOST: tmg_db
      DB_PORT: 3306
    volumes:
      - tmg_storage:/var/www/html/storage/app
      - tmg_logs:/var/www/html/storage/logs
    depends_on:
      tmg_db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/up"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - tmg_net

  # Laravel queue worker
  tmg_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tmg_worker
    restart: unless-stopped
    entrypoint: ["/worker.sh"]
    env_file:
      - .env
    environment:
      DB_HOST: tmg_db
      DB_PORT: 3306
    volumes:
      - tmg_storage:/var/www/html/storage/app
      - tmg_logs:/var/www/html/storage/logs
    depends_on:
      tmg_db:
        condition: service_healthy
      tmg_app:
        condition: service_healthy
    networks:
      - tmg_net

networks:
  tmg_net:
    driver: bridge

volumes:
  tmg_db_data:
  tmg_storage:
  tmg_logs:

